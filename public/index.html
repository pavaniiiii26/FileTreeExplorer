<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visual N-ary Tree File System Explorer for Data Structures course">
    <title>TreeFS — File System Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════ TOP BAR ═══════════════════════════════════════ -->
    <header id="topbar">
        <div class="topbar-left">
            <h1 class="brand">
                <span class="brand-icon">🌳</span>
                TreeFS
            </h1>

            <!-- Primary Action Buttons -->
            <div class="action-btn-group" id="topActionGroup">
                <button class="btn-action" id="btnTopNewFolder" title="Create new folder inside selected folder">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                    <span>New Folder</span>
                </button>
                <button class="btn-action" id="btnTopNewFile" title="Create new file inside selected folder">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    <span>New File</span>
                </button>
                <button class="btn-action" id="btnTopRename" title="Rename selected item">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span>Rename</span>
                </button>
                <button class="btn-action" id="btnTopMove" title="Move selected item into another folder">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
                    <span>Move</span>
                </button>
                <button class="btn-action btn-action-danger" id="btnTopDelete" title="Delete selected item and its subtree">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                    <span>Delete</span>
                </button>
            </div>
        </div>

        <div class="topbar-right">
            <!-- Search -->
            <div class="search-box">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input id="searchInput" type="text" placeholder="Search tree…" autocomplete="off">
                <span id="matchBadge" class="match-badge" hidden>0 matches</span>
            </div>

            <!-- Traversals -->
            <div class="traversal-group">
                <span class="toolbar-label">Traverse:</span>
                <button class="btn-trav" data-type="preorder" title="Preorder traversal (Parent -> Children)">Preorder</button>
                <button class="btn-trav" data-type="postorder" title="Postorder traversal (Children -> Parent)">Postorder</button>
                <button class="btn-trav" data-type="levelorder" title="Level-order traversal (BFS queue)">Level-order</button>
            </div>

            <!-- Reset Button -->
            <button class="btn-reset" id="resetBtn" title="Reset tree to sample data via fstree reset">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/>
                </svg>
                <span>Reset</span>
            </button>
        </div>
    </header>

    <!-- ═══════════════ RED ERROR BANNER ═══════════════════════════════ -->
    <div id="errorBanner" class="error-banner" hidden>
        <div class="error-banner-content">
            <span class="error-banner-icon">⚠️</span>
            <div class="error-banner-text">
                <strong>C Operation Error:</strong>
                <span id="errorBannerMsg"></span>
            </div>
        </div>
        <button id="errorBannerClose" class="error-banner-close" title="Dismiss banner">&times;</button>
    </div>

    <!-- ═══════════════ BREADCRUMB & SELECTION INFO ════════════════════ -->
    <nav id="breadcrumbBar" class="breadcrumb-bar">
        <div class="breadcrumb-left">
            <span class="breadcrumb-label">Path:</span>
            <div id="breadcrumb" class="breadcrumb">
                <span class="crumb" data-path="root">root</span>
            </div>
        </div>
        <div class="selected-indicator">
            Selected: <strong id="selectedNodeDisplay">root (Folder)</strong>
        </div>
    </nav>

    <!-- ═══════════════ MAIN CONTENT DASHBOARD ════════════════════════ -->
    <main id="mainContent">

        <!-- LEFT PANEL: Explorer sidebar -->
        <aside id="explorerPanel" class="panel explorer-panel">
            <div class="panel-header">
                <span class="panel-title">FILE EXPLORER</span>
            </div>
            <div id="fileTree" class="file-tree"></div>
        </aside>

        <!-- RIGHT CONTENT AREA: Tree diagram & Stats -->
        <section id="rightContent" class="right-content">

            <!-- Tree Diagram -->
            <div id="treeDiagramSection" class="card tree-diagram-card">
                <div class="card-header">
                    <div class="card-title-group">
                        <h2 class="card-title">N-ary Tree Diagram</h2>
                        <span class="card-subtitle">First-Child / Next-Sibling Linked Structure</span>
                    </div>
                    <div class="diagram-actions">
                        <button class="btn-trav btn-trav-accent" id="btnDfsSearch" title="Animate DFS search for current search query">DFS Search</button>
                    </div>
                </div>
                <div id="treeSvgContainer" class="tree-svg-container">
                    <svg id="treeSvg" class="tree-svg"></svg>
                </div>
            </div>

            <!-- Stats Cards -->
            <div id="statsSection" class="stats-section">
                <div class="stat-card" id="statFolders">
                    <span class="stat-label">Folders</span>
                    <span class="stat-value" id="statFoldersVal">0</span>
                </div>
                <div class="stat-card" id="statFiles">
                    <span class="stat-label">Files</span>
                    <span class="stat-value" id="statFilesVal">0</span>
                </div>
                <div class="stat-card" id="statHeight">
                    <span class="stat-label">Tree Height</span>
                    <span class="stat-value" id="statHeightVal">0</span>
                </div>
                <div class="stat-card stat-card-wide" id="statSizes">
                    <span class="stat-label">Folder Size (Postorder KB)</span>
                    <div id="folderBars" class="folder-bars"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- ═══════════════ CONTEXT MENU ═════════════════════════════════ -->
    <div id="contextMenu" class="context-menu" hidden>
        <button class="ctx-item" data-action="newFolder">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            New Folder
        </button>
        <button class="ctx-item" data-action="newFile">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            New File
        </button>
        <button class="ctx-item" data-action="rename">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Rename
        </button>
        <button class="ctx-item" data-action="move">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            Move...
        </button>
        <hr class="ctx-divider">
        <button class="ctx-item ctx-danger" data-action="delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            Delete
        </button>
    </div>

    <!-- ═══════════════ MODAL DIALOG (Create, Rename, Move) ════════════ -->
    <div id="dialogOverlay" class="dialog-overlay modal" hidden>
        <div class="dialog">
            <h3 id="dialogTitle" class="dialog-title">New Folder</h3>
            <p id="dialogSub" class="dialog-subtitle"></p>

            <div class="dialog-field" id="dialogFolderRow">
                <label id="dialogFolderLabel" for="dialogFolderSelect">Target Folder:</label>
                <select id="dialogFolderSelect" class="dialog-input dialog-select"></select>
            </div>

            <div class="dialog-field" id="dialogInputRow">
                <label id="dialogInputLabel" for="dialogInput">Name:</label>
                <input id="dialogInput" type="text" class="dialog-input" placeholder="Enter name" autocomplete="off">
            </div>

            <div id="dialogSizeRow" class="dialog-field dialog-size-row" hidden>
                <label for="dialogSize">Size (KB):</label>
                <input id="dialogSize" type="number" class="dialog-input" value="10" min="1">
            </div>

            <div class="dialog-actions">
                <button class="btn-secondary" id="dialogCancel">Cancel</button>
                <button class="btn-primary" id="dialogOk">Submit</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════ TOAST NOTIFICATIONS ══════════════════════════ -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
